<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Louvre</title>
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="body">
    <!-- *** HEADER *** -->
    <header class="header">
      <div class="header__container">
        <div class="header__logo">
          <img
            class="header__logo-image"
            src="./images/Frame.svg"
            alt="the Louvre pyramid"
          />
          <h1 class="header__title">Louvre</h1>
        </div>
        <nav class="header__nav">
          <ul class="header__nav-list">
            <li class="header__nav-item">
              <a href="#visiting" class="header__nav-link">Visiting</a>
            </li>
            <li class="header__nav-item">
              <a href="#explore" class="header__nav-link">Explore</a>
            </li>
            <li class="header__nav-item">
              <a href="#video" class="header__nav-link">Video</a>
            </li>
            <li class="header__nav-item">
              <a href="#gallery" class="header__nav-link">Gallery</a>
            </li>
            <li class="header__nav-item">
              <a href="#tickets" class="header__nav-link">Tickets</a>
            </li>
            <li class="header__nav-item">
              <a href="#contacts" class="header__nav-link">Contacts</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main">
      <section class="welcome"></section>

      <section class="visiting"></section>

      <section class="explore"></section>

      <section class="video"></section>

      <section class="gallery"></section>

      <section class="tickets"></section>

      <section class="contacts"></section>
    </main>

    <footer class="footer"></footer>
  </body>
</html>
